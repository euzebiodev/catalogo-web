# Configuração da restauração do catálogo.
# Copie este arquivo para restauracao.conf e preencha. NÃO envie o restauracao.conf para o git.
# Use aspas em todos os valores.

# --- Banco de dados (onde o catálogo será restaurado) ---
# Se o banco estiver neste mesmo computador e você usar o usuário postgres local, deixe DB_ADMIN_SUDO="sim" (só Linux).
DB_HOST="localhost"
DB_PORT="5432"
DB_NAME="catalogo"
DB_ADMIN_USUARIO="postgres"
DB_ADMIN_SENHA=""
DB_ADMIN_SUDO="nao"
# Versão do PostgreSQL das ferramentas (pg_restore). Use a mesma do servidor de origem (18).
PG_VERSAO="18"

# Senhas dos papéis que o site usa. Serão criados no banco se ainda não existirem.
LEITURA_USUARIO="catalogo_leitura"
LEITURA_SENHA=""
ESCRITA_USUARIO="catalogo_escrita"
ESCRITA_SENHA=""

# --- Google Drive criptografado (onde estão os backups) ---
# Essas duas senhas são as que você guardou ao criar o remoto "cripto" (rclone config).
CRIPTO_SENHA=""
CRIPTO_SENHA2=""
# Nome do remoto do Google Drive, criado com "rclone config" (tipo drive).
GDRIVE_REMOTO="gdrive"

# --- Onde baixar e restaurar ---
PASTA_DOWNLOAD="./restauracao-download"
# Deixe vazio para usar o dump mais recente; ou informe o nome do arquivo.
DUMP_ESCOLHIDO=""
# Pasta onde as capas serão extraídas (dentro dela ficará a pasta "capas").
PASTA_CAPAS_DESTINO="./restauracao-capas"

# Permitir sobrescrever um banco que já tem dados? "sim" ou "nao". Use "nao" por segurança.
SOBRESCREVER="nao"
