<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Catálogo{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='icone.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <h1>Catálogo pessoal</h1>
      {% if logado() %}
        <a class="sessao-link" href="{{ url_for('catalogo.alterar_senha') }}">Alterar senha</a>
        <form method="post" action="{{ url_for('catalogo.sair') }}" class="sessao">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button type="submit" class="sessao-botao">Sair</button>
        </form>
      {% elif edicao_ativa %}
        <a class="sessao-link" href="{{ url_for('catalogo.entrar') }}">Entrar</a>
      {% endif %}
    </div>
    <nav class="abas" aria-label="Coleções">
      {% for chave, aba in abas.items() %}
        <a href="{{ url_for('catalogo.lista', tipo=chave) }}"
           class="aba{{ ' ativa' if chave == tipo_ativo }}"
           {% if chave == tipo_ativo %}aria-current="page"{% endif %}>{{ aba.nome }}</a>
      {% endfor %}
    </nav>
  </header>

  <main class="conteudo">
    {% block conteudo %}{% endblock %}
  </main>

  {% block fim %}{% endblock %}
</body>
</html>
