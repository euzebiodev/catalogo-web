{% extends "base.html" %}

{% block titulo %}Alterar senha · Catálogo{% endblock %}

{% block conteudo %}
  <section class="entrar">
    <h2>Alterar senha</h2>
    {% if sucesso %}
      <p class="aviso ok" role="status">Senha alterada. Use a nova senha no próximo login.</p>
    {% endif %}
    {% if erro %}
      <p class="aviso erro" role="alert">{{ erro }}</p>
    {% endif %}
    <form method="post" action="{{ url_for('catalogo.alterar_senha') }}" class="entrar-form">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label>
        <span>Senha atual</span>
        <input type="password" name="senha_atual" required autocomplete="current-password">
      </label>
      <label>
        <span>Nova senha (mínimo 8 caracteres)</span>
        <input type="password" name="senha_nova" required minlength="8" autocomplete="new-password">
      </label>
      <label>
        <span>Repita a nova senha</span>
        <input type="password" name="senha_confirmacao" required minlength="8" autocomplete="new-password">
      </label>
      <button type="submit">Trocar senha</button>
    </form>
    <p class="voltar"><a href="{{ url_for('catalogo.inicio') }}">← Voltar ao catálogo</a></p>
  </section>
{% endblock %}
