{% extends "base.html" %}

{% block titulo %}Entrar · Catálogo{% endblock %}

{% block conteudo %}
  <section class="entrar">
    <h2>Entrar para editar</h2>
    {% if indisponivel %}
      <p class="aviso" role="status">A edição não está configurada neste servidor.</p>
    {% else %}
      {% if erro %}
        <p class="aviso erro" role="alert">{{ erro }}</p>
      {% endif %}
      <form method="post" action="{{ url_for('catalogo.entrar') }}" class="entrar-form">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <input type="hidden" name="proxima" value="{{ proxima }}">
        <label>
          <span>Usuário</span>
          <input type="text" name="usuario" required autocomplete="username" autocapitalize="none">
        </label>
        <label>
          <span>Senha</span>
          <input type="password" name="senha" required autocomplete="current-password">
        </label>
        <button type="submit">Entrar</button>
      </form>
    {% endif %}
  </section>
{% endblock %}
